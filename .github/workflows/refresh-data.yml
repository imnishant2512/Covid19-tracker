name: Refresh COVID data

# WHO publishes weekly, so check on Mondays and open a commit only when the
# figures have actually moved. Also runnable on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# A manual run overlapping the schedule would race it to push.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate the data snapshot
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      updated: ${{ steps.commit.outputs.updated }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Rebuild the snapshot from WHO
        run: npm run build:data

      - name: Verify the app still builds and passes against the new data
        run: |
          npm run lint
          npm test
          npm run build

      - name: Commit the snapshot if it changed
        id: commit
        run: |
          # Both data files: the snapshot and the weekly history behind the
          # date filter. Either changing is a change worth publishing.
          if git diff --quiet -- public/data/ && [ -z "$(git ls-files --others --exclude-standard -- public/data/)" ]; then
            echo "No change in WHO figures; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          UPDATED=$(node -p "require('./public/data/covid-snapshot.json').updated")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "chore(data): refresh WHO snapshot through ${UPDATED}"
          git push

          # The deploy must build this commit, not the one the run started from.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "updated=${UPDATED}" >> "$GITHUB_OUTPUT"

  deploy:
    # This commit is made with GITHUB_TOKEN, which by design does not trigger
    # other workflows, so the deploy has to be called from here. The refresh job
    # already ran lint, tests and a build against the new figures before
    # committing, so the data is verified by the time this runs.
    name: Publish the refreshed data
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    # Only the refresh job pushes; the deploy just reads the commit.
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      reason: "weekly WHO data refresh"
      ref: ${{ needs.refresh.outputs.sha }}
      expected-updated: ${{ needs.refresh.outputs.updated }}
