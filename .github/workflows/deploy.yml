name: Deploy

# Reusable so both paths to a deploy can call it:
#   - ci.yml, once lint, tests and the end-to-end suite have passed
#   - refresh-data.yml, when the weekly WHO refresh actually changed the figures
#
# A plain `on: push` trigger would not work for the second case. The refresh
# commits using GITHUB_TOKEN, and GitHub does not trigger workflows from pushes
# made with it, so the data refresh — the one case this exists for — would never
# deploy.
on:
  workflow_call:
    inputs:
      reason:
        description: "What prompted the deploy, for the run summary."
        required: false
        type: string
        default: "push to main"
      ref:
        description: >-
          Commit to build. Defaults to the commit that started the calling run,
          which is wrong for the data refresh: that run pushes a new commit
          after it starts, so building the starting commit publishes the
          previous week's figures.
        required: false
        type: string
        default: ""
      expected-updated:
        description: "If set, the snapshot's `updated` date the build must contain."
        required: false
        type: string
        default: ""
      latest-only:
        description: >-
          Skip the deploy if main has moved past this commit. Every commit on
          main deploys itself, so an older one finishing last would otherwise
          overwrite newer figures on the live site.
        required: false
        type: boolean
        default: true
  # A manual run deploys whatever it is pointed at, which is how to roll back.
  workflow_dispatch:

jobs:
  hosting:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest

    # One deploy at a time, so the superseded check below cannot pass for two
    # runs at once and leave whichever finishes last on the live site.
    concurrency:
      group: firebase-hosting
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check this is still the newest commit on main
        id: current
        env:
          LATEST_ONLY: ${{ inputs.latest-only }}
        run: |
          BUILDING=$(git rev-parse HEAD)
          MAIN=$(git ls-remote origin refs/heads/main | cut -f1)

          if [ "$LATEST_ONLY" = "true" ] && [ "$BUILDING" != "$MAIN" ]; then
            echo "main is at $MAIN, past $BUILDING; its own run will deploy it."
            echo "::notice::Skipped: superseded by $MAIN"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.current.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.current.outputs.skip != 'true'
        run: npm ci

      - name: Build
        if: steps.current.outputs.skip != 'true'
        run: npm run build

      - name: Confirm the snapshot is in the build
        if: steps.current.outputs.skip != 'true'
        env:
          EXPECTED_UPDATED: ${{ inputs.expected-updated }}
        run: |
          test -f build/data/covid-snapshot.json
          node -e "
            const s = require('./build/data/covid-snapshot.json');
            if (!s.updated || !s.countries?.length) {
              throw new Error('Snapshot is present but empty or malformed');
            }
            // Guards against building the wrong commit, which previously
            // published stale data while every step reported success.
            const expected = process.env.EXPECTED_UPDATED;
            if (expected && s.updated !== expected) {
              throw new Error('Snapshot is through ' + s.updated + ' but ' + expected + ' was expected');
            }
            console.log('Snapshot: through ' + s.updated + ', ' + s.countries.length + ' countries');
          "

      - name: Deploy
        if: steps.current.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi

          # Written outside the workspace so it can never be picked up by a
          # build step, and removed again whatever the outcome.
          KEY="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY"
          trap 'rm -f "$KEY"' EXIT

          # Pinned: this runs with the service-account key in reach, so it must
          # be a version chosen deliberately, not whatever npm serves today.
          GOOGLE_APPLICATION_CREDENTIALS="$KEY" \
            npx --yes firebase-tools@15.31.0 deploy \
              --only hosting \
              --project covid19-tracker-c92c2 \
              --non-interactive

      - name: Summary
        if: success() && steps.current.outputs.skip != 'true'
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Reason: ${{ inputs.reason || 'manual run' }}"
            echo "- Commit: \`${{ inputs.ref || github.sha }}\`"
            echo "- URL: https://covid19-tracker-c92c2.web.app"
          } >> "$GITHUB_STEP_SUMMARY"
